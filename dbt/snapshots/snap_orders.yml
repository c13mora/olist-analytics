snapshots:
  - name: snap_orders
    description: >
      History of every order's status (SCD Type 2): one row per version of an
      order, valid from `dbt_valid_from` until `dbt_valid_to` (null for the
      current version). Versions are dated in the replay's business time:
      the timestamp strategy uses `status_updated_at`, the latest milestone
      that has happened, rather than when `dbt snapshot` ran. A snapshot run
      sees one state per order, so run it after every `replay.py --days 1`
      to capture each day's changes.
    relation: ref('stg_olist__orders')
    config:
      schema: snapshots
      unique_key: order_id
      strategy: timestamp
      # Not _loaded_at: it changes whenever a day is reloaded, which would
      # record versions where nothing changed.
      updated_at: status_updated_at
    data_tests:
      # Each order's versions follow each other without gaps or overlaps.
      - dbt_utils.mutually_exclusive_ranges:
          arguments:
            lower_bound_column: dbt_valid_from
            upper_bound_column: coalesce(dbt_valid_to, cast('9999-12-31' as {{ dbt.type_timestamp() }}))
            partition_by: order_id
            gaps: not_allowed
    columns:
      - name: dbt_scd_id
        description: Unique id of the version, generated by dbt.
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: "{{ doc('olist__order_id') }}"
        data_tests:
          - not_null
          # Exactly one current version per order.
          - unique:
              config:
                where: dbt_valid_to is null
      - name: order_status
        description: "{{ doc('olist__order_status') }} As of this version."
      - name: status_updated_at
        description: Business time this version started. Equal to `dbt_valid_from`.
      - name: dbt_valid_from
        description: When this version became current, in the replay's business time.
        data_tests:
          - not_null
      - name: dbt_valid_to
        description: When the next version replaced this one. Null for the current version.
      - name: dbt_updated_at
        description: The `status_updated_at` value dbt used for this version.
