name: olist
version: '1.0.0'
config-version: 2

profile: olist

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  olist:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      core:
        +materialized: table
        +schema: marts
      sales:
        +materialized: table
        +schema: marts
      logistics:
        +materialized: table
        +schema: marts

seeds:
  # The project's own exceptions (seeds/dbt_project_evaluator_exceptions.csv)
  # replace the package's empty default seed of the same name.
  dbt_project_evaluator:
    dbt_project_evaluator_exceptions:
      +enabled: false

data_tests:
  # dbt_project_evaluator's checks warn by default; CI sets
  # DBT_PROJECT_EVALUATOR_SEVERITY=error so a change that breaks one of its
  # rules fails the pull request. Exceptions: seeds/dbt_project_evaluator_exceptions.csv.
  dbt_project_evaluator:
    +severity: "{{ env_var('DBT_PROJECT_EVALUATOR_SEVERITY', 'warn') }}"
