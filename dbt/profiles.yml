olist:
  target: dev
  outputs:
    dev:
      type: duckdb
      # Same file the replay loader writes to. Relative to dbt/, where dbt runs.
      path: "../data/olist.duckdb"
      schema: main
      threads: 4

    # Used by SQLFluff (see .sqlfluff), which runs from the repo root where the
    # relative dev path above would not resolve. Linting only compiles SQL, so
    # an in-memory database is enough.
    lint:
      type: duckdb
      path: ":memory:"
      schema: main
      threads: 1

    # Key-pair sign-in for the service user created by snowflake/setup.sql.
    # The private key stays on your computer; only its path is read here.
    # The replay loader (--destination snowflake) uses the same variables.
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'OLIST_SERVICE') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'TRANSFORMER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'OLIST_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'OLIST') }}"
      schema: dbt_dev
      threads: 4
