repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=500"]

  # SQLFluff runs from the project's uv environment, so the hook uses the same
  # locked sqlfluff, dbt templater and dbt versions as CI. It lints the same
  # path as CI (dbt/models); macros are mostly Jinja and are not linted.
  - repo: local
    hooks:
      - id: sqlfluff-lint
        name: sqlfluff-lint
        entry: uv run sqlfluff lint
        language: system
        types: [sql]
        files: ^dbt/models/
