name: Deploy site

# Builds the Evidence dashboard and the dbt docs from the full replayed
# dataset, and publishes them together to GitHub Pages:
#   https://c13mora.github.io/olist-analytics/            dashboard
#   https://c13mora.github.io/olist-analytics/dbt-docs/   dbt docs
# Pull requests only build and check the site; pushes to main also publish.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer run on the same branch replaces one still in progress.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build dashboard and dbt docs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read

    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt

    defaults:
      run:
        # Explicit bash enables pipefail, so a failing command piped into
        # tee still fails the step.
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      # Same cached CSVs as the CI workflow (see ci.yml).
      - name: Restore Olist CSVs from cache
        id: olist-csvs
        uses: actions/cache@v4
        with:
          path: data/raw
          key: olist-csvs-v1

      - name: Download Olist CSVs from Kaggle
        if: steps.olist-csvs.outputs.cache-hit != 'true'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: uvx --from "kaggle>=2.2" kaggle datasets download olistbr/brazilian-ecommerce -p data/raw --unzip

      - name: Install Python dependencies
        run: uv sync

      - name: Install dbt packages
        run: cd dbt && uv run dbt deps

      # The dashboard shows the whole history, so replay to the end of the
      # data in one go (700 days from 2016-12-31 reaches past October 2018).
      - name: Replay the full dataset
        run: |
          uv run python ingestion/replay.py --reset
          uv run python ingestion/replay.py --days 700

      # Every model and test must pass before anything is published.
      - name: Build and test all models
        run: cd dbt && uv run dbt build -s olist

      - name: Generate dbt docs as a single static page
        run: cd dbt && uv run dbt docs generate --static

      - name: Install dashboard dependencies
        run: cd dashboard && npm ci

      - name: Load the marts into the dashboard
        run: cd dashboard && npm run sources

      # Evidence's build:strict does not fail on broken SQL: a failing query
      # only prints "Error in Query!". Fail the job on that message instead.
      - name: Build the dashboard
        run: |
          cd dashboard
          npm run build:strict 2>&1 | tee build.log
          if grep -q "Error in Query" build.log; then
            echo "::error::A dashboard query failed during the build (see 'Error in Query' above)."
            exit 1
          fi

      # Runs every page's SQL the way the browser does, including queries that
      # only run client-side (chained queries, filters), which the build does
      # not execute.
      - name: Check every dashboard query
        run: uv run python scripts/check_dashboard_queries.py

      - name: Assemble the site
        run: |
          mkdir -p site/dbt-docs
          cp -r dashboard/build/. site/
          cp dbt/target/static_index.html site/dbt-docs/index.html

      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
